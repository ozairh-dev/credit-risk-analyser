# Verified and REJECTED candidates. A rejection is evidence.
rejected:
  - candidate: WE
    cik: 1813756
    name: "WeWork Inc."
    why: >-
      SIC 6512 (Operators of Nonresidential Buildings) falls inside the 6000-6799 range docs/data-sources.md excludes from the universe. Admitting it would contradict the project's own scope rule. It is also exactly the balance-sheet shape that rule excludes: an office lessor whose liabilities are overwhelmingly operating leases.

  - candidate: HTZ-old
    cik: 1364479
    name: "Hertz Global Holdings Inc (pre-2016 CIK)"
    why: >-
      IDENTITY TRAP. This CIK is now HERC HOLDINGS INC — the equipment-rental business spun off in 2016, which KEPT the old CIK and did not fail. The car-rental business that filed Chapter 11 is on CIK 1657853. Using this CIK would place a surviving spinco in the failure cohort.

  - candidate: JCP-old
    cik: 77182
    name: "J C Penney Corp Inc"
    why: >-
      Wrong entity: the pre-2002 operating subsidiary. Two 10-Ks (1994, 1995), no Item 1.03 8-K, no XBRL. The public parent that filed in 2020 is CIK 1166126.

  - candidate: BBBY-wrong
    cik: 1130713
    name: "Bed Bath & Beyond, Inc. (the NAME, not the filer)"
    why: >-
      IDENTITY TRAP. CIK 1130713 is Overstock.com, which bought the Bed Bath & Beyond brand out of the 2023 bankruptcy auction and renamed ITSELF. It did not fail. The filer that failed is CIK 886158, now named 20230930-DK-Butterfly-1, Inc.

  - candidate: WE-companies
    cik: 1533523
    name: "WeWork Companies Inc/LLC"
    why: >-
      No 10-K and no annual XBRL — nothing for the engine to read.
