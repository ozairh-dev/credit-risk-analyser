# A2 — the survivor panel: the 43 adopted companies of D65.
#
# "Survivor" is asserted against EDGAR, not assumed from the ticker still being
# listed. Every CIK below was checked for an 8-K under Item 1.03 (Bankruptcy or
# Receivership) across its entire filing history.
#
# ONE member is not an unconditional survivor. **CHTR filed Item 1.03 8-Ks on
# 2009-03-27 and 2009-11-23** — Charter Communications' 2009 prepackaged
# Chapter 11. Every cutoff in this benchmark is 2018 or later, by which time
# Charter had emerged and did not fail again, so it is a valid survivor HERE.
# It carries `excluded_before` so the harness enforces that rather than trusting
# this comment, and so a future cutoff earlier than 2010 cannot silently admit a
# defaulting company to the survivor panel.
#
# Charter's own 2009 default was tested as a candidate FAILURE case and cannot
# be used: measured, its companyfacts begins 2011-05-03, so a 2008-03-27 cutoff
# yields **zero facts**. XBRL did not exist yet. This is the hard floor on the
# whole backtest — no pre-2011 default is reachable, so the 2008-09 credit cycle
# is out of scope and the cohort is confined to the COVID and 2022-23 waves.
#
# Item 2.04 (triggering events accelerating an obligation) is deliberately NOT
# treated as a default event. It appears for CHTR x10, MGM x4, DPZ x2 and
# CMI/CZR/YUM x1, and is routinely filed alongside ordinary refinancing and
# covenant mechanics. Counting it without reading each document would
# manufacture defaults out of housekeeping.

