# All values here are ASSUMED and go in the assumption register.
# PER-RUN values (ebitda_mode, fixed_cost_share, floating_share, and the resolved
# new_debt_rate) are recorded as COLUMNS on each stress run, not fingerprinted: a value
# that varies per run is not a config version, and fingerprinting one would make two runs
# with different assumptions hash identically (D56). The stress fingerprint covers the
# POLICY keys only — presets, sensitivity_grid, default_tax_rate, new_debt_rate_default,
# new_debt_rate_band.
ebitda_mode: constant_margin        # or operating_leverage

# Used only in operating_leverage mode; overridable per custom scenario, and every
# operating-leverage output must PRINT the value used (D53a). Measured: any value in
# [0.2, 0.7] moves the stressed grade by at most one level at the preset shocks — but
# the stressed FIGURES swing widely (CCL 2019 Severe: EBITDA 2.90bn -> 1.36bn across
# the range; LUMN 2019 flips sign), which is why the visibility duty exists. 0.3 is a
# mild setting (70% of costs variable), likely conservative-light for asset-heavy
# names; per-sector values are D48's sector-thresholds item, not this file's job.
fixed_cost_share: 0.3

# Share of debt that reprices under a rate shock. Stays 1.0 because the fixed/floating
# split is UNREACHABLE, not merely unreliable: measured across all five cached payloads
# (360-666 us-gaap tags each), zero FloatingRate/VariableRate tags and no USD-denominated
# rate-split amount anywhere. Per-run overridable, and every stress output must PRINT the
# value used (D54) — this is NOT cheap conservatism: at 1.0 vs 0.3 the stressed grade
# moves in four measured periods, including CCL 2015 and 2018 falling 3 -> 4 at Severe.
floating_share: 1.0

# Used when pretax_income <= 0, or when the tax inputs are missing entirely (D53d).
# Reached in 48 of 87 periods (55%) — the dominant path, not an edge case. Kept at the
# US federal STATUTORY rate rather than the 16.31% in-sample median (D55): the measured
# effective rates are dominated by loss carry-forwards, one-off benefits and sector
# regimes — CCL's ~0.2% is tonnage tax — which is exactly what a stress scenario must not
# project forward. Fitting the median would fit five companies' tax accidents.
default_tax_rate: 0.21

# New-debt pricing for additional_debt (D53b). Resolution order:
#   1. new_debt_rate, when set — explicit override wins
#   2. the implied rate interest_expense / total_debt, IF inside new_debt_rate_band
#   3. new_debt_rate_default
# Every substitution is surfaced in the stress output (which rate, and why) and
# recorded in the assumption register. The band exists because both failure
# directions occur in-sample: Ford's implied 287-860% (captive finance, D25) and
# JNJ's 0.51-0.67% ZIRP-era average, which would price NEW stress borrowing at half
# a percent. The default sits above the 4.12% in-sample median deliberately: debt
# raised in a stress scenario does not price at the calm-times average.
# NOTE FOR PHASE 8: nothing reads these yet; the engine wires them (like D26's
# tolerance before Task 9).
new_debt_rate: null
new_debt_rate_default: 0.06
new_debt_rate_band: [0.02, 0.12]

# Presets deliberately carry additional_debt: 0 (D53c): incremental borrowing under
# stress is real but company-specific, and a preset carrying it would encode a view
# about how much a given company borrows in a downturn, which a global scenario
# cannot assert. Incremental debt is a custom-scenario lever.
presets:
  base:     {revenue_shock: 0.00, margin_shock: 0.00, rate_shock_bps: 0,   additional_debt: 0, capex_shock: 0.0}
  moderate: {revenue_shock: -0.10, margin_shock: 0.02, rate_shock_bps: 100, additional_debt: 0, capex_shock: 0.0}
  severe:   {revenue_shock: -0.20, margin_shock: 0.05, rate_shock_bps: 200, additional_debt: 0, capex_shock: 0.0}

sensitivity_grid:
  revenue_shock: [0.0, -0.05, -0.10, -0.15, -0.20]
  margin_shock:  [0.0, 0.01, 0.02, 0.03, 0.05]
