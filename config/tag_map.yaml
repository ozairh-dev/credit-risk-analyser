# Candidate-tag disagreement (D69). For concepts whose candidate tags name the SAME
# quantity in different taxonomy eras, two tags resolving to materially different values
# means one is wrong or partial — so the concept REFUSES rather than computing from the
# higher-priority tag and flagging (D26's rule, generalised from debt to revenue).
#
# Concepts NOT listed here have candidate tags that are DELIBERATELY different quantities
# — equity with and without non-controlling interests, interest_expense at different
# scopes, short_term_debt's DebtCurrent (already guarded by D32). Refusing there would
# discard a correct value because a different measure disagrees.
# Tolerance MEASURED, not guessed (rule 14). Across the 43 adopted companies the
# revenue disagreement distribution is bimodal: legitimate scope differences reach
# 12.4% at p90 — Ford's `Revenues` includes Ford Credit's financing revenue while
# `SalesRevenueNet` is automotive only (5-11%); LUMN's `Revenues` exceeds ASC 606
# contract revenue (6-10%) — while genuine errors sit at ~90% (GIS tags a segment
# figure of 2.0bn against a true 19.9bn). 0.50 separates them cleanly. A 5% tolerance
# would have refused 65 concept-periods, nearly all of them legitimate.
candidate_disagreement_tolerance: 0.50

# Only concepts whose candidates name the SAME quantity. Measured exclusions:
#   d_and_a                p90 60.6% — Depreciation vs Depreciation+Amortization+Accretion
#   short_term_investments p50 98.1% — ShortTermInvestments vs MarketableSecuritiesCurrent
#   equity / interest_expense / short_term_debt — different scopes by definition
# For those the priority order IS the answer, and refusing would discard a correct
# value because a different measure disagrees.
refuse_on_candidate_disagreement:
  - revenue
  - cost_of_revenue
  - dividends

# Ordered candidate us-gaap tags per internal concept. First present wins.
# Record source_tag on every REPORTED value. Extend per company; never guess.
revenue: [Revenues, RevenueFromContractWithCustomerExcludingAssessedTax, SalesRevenueNet]
cost_of_revenue: [CostOfRevenue, CostOfGoodsAndServicesSold]
gross_profit: [GrossProfit]
ebit: [OperatingIncomeLoss]
d_and_a: [DepreciationDepletionAndAmortization, DepreciationAndAmortization, DepreciationAmortizationAndAccretionNet]
interest_expense: [InterestExpense, InterestExpenseNonoperating, InterestExpenseDebt]
pretax_income: [IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest]
tax_expense: [IncomeTaxExpenseBenefit]
net_income: [NetIncomeLoss]
cash: [CashAndCashEquivalentsAtCarryingValue]
# OtherShortTermInvestments ranked last: it is the only tag BDX, KO and SYK
# offer in 26 periods, where net_debt was otherwise overstated by the whole
# investment balance. Same class as the cfo gap (D79).
short_term_investments: [ShortTermInvestments, MarketableSecuritiesCurrent,
                         OtherShortTermInvestments]
receivables: [AccountsReceivableNetCurrent]
inventory: [InventoryNet]
current_assets: [AssetsCurrent]
total_assets: [Assets]
current_liabilities: [LiabilitiesCurrent]
total_liabilities: [Liabilities]
short_term_debt: [ShortTermBorrowings, CommercialPaper, DebtCurrent]
current_ltd: [LongTermDebtCurrent]
noncurrent_ltd: [LongTermDebtNoncurrent]
total_ltd_aggregate: [LongTermDebt]
# Lease-inclusive LTD (DECISIONS D27). Some filers report long-term debt only bundled
# with capital/finance lease obligations. These are DISTINCT concepts, not aliases of
# current_ltd / noncurrent_ltd: on this branch the lease components are already inside
# the figure and must not be added again.
ltd_incl_leases_current: [LongTermDebtAndCapitalLeaseObligationsCurrent]
ltd_incl_leases_noncurrent: [LongTermDebtAndCapitalLeaseObligations]
# CROSS-CHECK ONLY — never a value source (D27). DebtAndCapitalLeaseObligations is used
# solely to reconcile the two concepts above. Ford reports it as 152,577M for 2008-2017
# and then 600M for 2018-2020 on the same tag; treating it as a value would reintroduce
# exactly the error D25 retired Ford for.
ltd_incl_leases_aggregate: [DebtAndCapitalLeaseObligations]
finance_lease_liab_current: [FinanceLeaseLiabilityCurrent]
finance_lease_liab_noncurrent: [FinanceLeaseLiabilityNoncurrent]
operating_lease_liab_current: [OperatingLeaseLiabilityCurrent]
operating_lease_liab_noncurrent: [OperatingLeaseLiabilityNoncurrent]
equity: [StockholdersEquity, StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest]
# The continuing-operations variant is ranked SECOND, not first: where a filer
# reports the total it is the complete figure and must keep winning. It is the
# only tag 19 of the 43 companies offer for some periods, and without it they
# lose cfo, fcf, fcf_margin, fcf_to_debt and cfo_to_debt entirely (D79).
cfo: [NetCashProvidedByUsedInOperatingActivities,
      NetCashProvidedByUsedInOperatingActivitiesContinuingOperations]
capex: [PaymentsToAcquirePropertyPlantAndEquipment]
dividends: [PaymentsOfDividends, PaymentsOfDividendsCommonStock]
debt_issued: [ProceedsFromIssuanceOfLongTermDebt]
debt_repaid: [RepaymentsOfLongTermDebt]

# Concepts where a later candidate tag WINS if it is larger (D80).
# Rank order assumes earlier candidates are at least as complete as later
# ones. For d_and_a that is false and filer-dependent: MCD tags
# DepreciationDepletionAndAmortization at 382m (an income-statement line)
# while DepreciationAndAmortization carries the full 1,978m cash-flow
# add-back; YUM and SBUX are the other way round. Both were checked against
# the filings. D&A is an add-back, so completeness is the criterion and the
# larger figure is the right one — a narrower tag means the filer split D&A
# across elements.
prefer_largest_candidate: [d_and_a]
