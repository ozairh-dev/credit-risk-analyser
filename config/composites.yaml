# Composite-concept settings (docs/credit-methodology.md "Composite concepts").
# This file is the authority for these values — nothing here is defaulted in code
# (CLAUDE.md rule 6). store/fingerprint.py raises if a key below is missing.

# Total debt composition (D6). Operating leases are debt-like post-ASC 842, so they
# are included by default; the ex-lease figure is shown alongside wherever it can be
# computed (on D27's lease-inclusive branch it cannot, and is UNAVAILABLE).
include_operating_leases: true

# Net debt composition: subtract short-term investments as well as cash.
include_st_investments: true

# Maximum relative deviation between the long-term-debt components
# (current_ltd + noncurrent_ltd) and total_ltd_aggregate before total_debt is
# refused. Above this, total_debt is UNAVAILABLE with reason
# COMPONENT_AGGREGATE_MISMATCH — it is never computed-and-flagged (DECISIONS D26).
#
# NOTE FOR TASK 9: this value changes whether total_debt computes at all, so it
# must join the fingerprint allowlist in store/fingerprint.py when the
# composites are wired (D18). It is deliberately not in that allowlist yet,
# because nothing reads it yet.
component_aggregate_tolerance: 0.05
