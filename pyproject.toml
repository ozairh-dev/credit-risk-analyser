[project]
name = "credit-risk"
version = "0.1.0"
description = "Credit risk analysis for US-listed non-financial companies, built on SEC XBRL data"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "requests-mock>=1.12",
]
# Build-time only, for docs/build_site.py. Nothing in src/ imports it and the
# generated docs/index.html is committed, so a missing docs dependency fails at
# build time and never at serve time. Declared rather than relied on
# transitively: it arrives today via typer -> rich -> markdown-it-py, and an
# undeclared dependency is one that disappears on an unrelated upgrade.
docs = [
    "markdown-it-py>=3.0",
]

[project.scripts]
credit-risk = "credit_risk.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
